[project]
name = "secret-validator-grunt"
version = "0.1.0"
description = "Agentic validation of GitHub Secret Scanning alerts."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.2.4",
    "pydantic>=2.14,<3",
    "pydantic-settings>=2.16,<3",
    "pyyaml>=6.0.3",
    "rich>=15",
    "typer>=0.27",
    "github-copilot-sdk>=1.0.21,<2",
    "ghapi>=2.1.4,<3",
    "validate-secrets @ git+https://github.com/advanced-security/validate-secrets.git@42843eb8eccafc2c352e0b7aa62dd43f5e2ab60f",
]

[project.optional-dependencies]
dev = [
    "coverage>=7.16",
    "pytest>=9.1",
    "pytest-asyncio>=1.4.0",
    "yapf>=0.43",
]

[project.scripts]
fmt = "secret_validator_grunt.cli_fmt:fmt_main"
fmt-check = "secret_validator_grunt.cli_fmt:fmt_check_main"
secret-validator-grunt = "secret_validator_grunt.main:entrypoint"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/secret_validator_grunt"]

[tool.hatch.build.targets.sdist]
include = ["src/secret_validator_grunt", "README.md", "LICENSE", ".env.example"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
